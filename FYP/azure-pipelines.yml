trigger:
  branches:
    include:
      - main

variables:
  imageRepositoryBackend: 'schedulix-backend'
  imageRepositoryFrontend: 'schedulix-frontend'
  dockerfilePathBackend: '$(Build.SourcesDirectory)/FYP/backend/Dockerfile'
  dockerfilePathFrontend: '$(Build.SourcesDirectory)/FYP/frontend/Dockerfile'
  tag: '$(Build.BuildId)'
  ACR_NAME: 'schedulixregistry'
  ACR_LOGIN_SERVER: 'schedulixregistry.azurecr.io'
  BACKEND_APP_SERVICE_NAME: 'schedulix-backend'
  FRONTEND_APP_SERVICE_NAME: 'schedulix-frontend'

stages:
- stage: BuildAndPush
  displayName: Build and push Docker images
  jobs:
  - job: BuildBackend
    displayName: Build and push backend image
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push backend image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepositoryBackend)
        dockerfile: $(dockerfilePathBackend)
        containerRegistry: 'ACR Service Connection'
        tags: |
          $(tag)
          latest

  - job: BuildFrontend
    displayName: Build and push frontend image to ACR
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push frontend image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepositoryFrontend)
        dockerfile: $(dockerfilePathFrontend)
        containerRegistry: 'ACR Service Connection'
        tags: |
          $(tag)
          latest

- stage: DeployBackend
  displayName: Deploy backend to Azure App Service
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - deployment: DeployBackend
    displayName: Deploy backend
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy backend container
            inputs:
              azureSubscription: 'Azure Service Connection'
              appName: $(BACKEND_APP_SERVICE_NAME)
              imageName: '$(ACR_LOGIN_SERVER)/$(imageRepositoryBackend):$(tag)'
              containerCommand: ''

- stage: DeployFrontend
  displayName: Deploy frontend to Azure App Service
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - deployment: DeployFrontend
    displayName: Deploy frontend
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy frontend container
            inputs:
              azureSubscription: 'Azure Service Connection'
              appName: $(FRONTEND_APP_SERVICE_NAME)
              imageName: '$(ACR_LOGIN_SERVER)/$(imageRepositoryFrontend):$(tag)'
              containerCommand: ''